# Security headers, included from every context that sets its own headers.
#
# nginx's add_header has no additive inheritance: as soon as a location declares
# one add_header, it discards every add_header inherited from the server block.
# Declaring these once in `server {}` therefore left the HTML document and the JS
# bundles — the responses that actually need a CSP — without any of them, while
# proxied API responses (no location-level add_header) still had them. Including
# this file wherever a location adds its own header keeps the set complete.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
